name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest --cov=agenteval --cov-report=term --cov-report=xml

      - name: Install-time self check
        run: python scripts/verify.py

      - name: CLI smoke
        run: |
          agenteval graders
          agenteval power --baseline 0.7 --delta 0.05

      - name: Examples
        run: python examples/extraction_eval.py

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Tests pass from the sdist, not just the repo
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/agenteval-*
          python -m venv .venv
          .venv/bin/pip install ".[dev]"
          .venv/bin/python -m pytest -q
          .venv/bin/python scripts/verify.py
          .venv/bin/agenteval graders

      - name: Wheel installs with no dependencies
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install dist/*.whl
          installed="$(/tmp/bare/bin/pip list --format=freeze \
            --exclude pip --exclude setuptools --exclude wheel | grep -civ '^agenteval==')"
          test "$installed" -eq 0 || {
            echo "wheel pulled in unexpected dependencies:"; /tmp/bare/bin/pip list; exit 1; }
          /tmp/bare/bin/python -c "import agenteval; print(agenteval.__version__)"

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(python -c 'import agenteval; print(agenteval.__version__)')"
          test "$tagged" = "$declared" || {
            echo "tag $GITHUB_REF_NAME does not match version $declared"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check agenteval tests scripts
